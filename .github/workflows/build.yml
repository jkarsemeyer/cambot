name: Build installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    env:
      VERSION: 0.2.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build CAMBOT Camera (virtual webcam DLL)
        shell: pwsh
        run: |
          $sc = "$env:GITHUB_WORKSPACE\native\softcam"
          New-Item -ItemType Directory -Force "$sc\dist\bin\x64", "$sc\dist\lib\x64", "$env:GITHUB_WORKSPACE\native\build" | Out-Null
          msbuild "$sc\src\softcam\softcam.vcxproj" /m /nologo /v:minimal /p:Configuration=Release /p:Platform=x64 "/p:SolutionDir=$sc\\"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dll = "$env:GITHUB_WORKSPACE\native\build\cambot_camera.dll"
          Copy-Item "$sc\x64\Release\softcam.dll" $dll
          # Call apps load this DLL into themselves, so it must not need the Visual C++ runtime installed.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $deps = & $dumpbin.FullName /nologo /dependents $dll
          $deps
          if ($deps -match 'VCRUNTIME|MSVCP|api-ms-win-crt') { Write-Error "cambot_camera.dll still depends on the Visual C++ runtime"; exit 1 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm version ${{ env.VERSION }} --no-git-tag-version --allow-same-version

      # Catch syntax errors before they ship (a broken file once silently disabled the voice processor).
      - name: Check app code parses
        shell: pwsh
        run: |
          $files = @(Get-ChildItem app\src -Recurse -Filter *.js) + @(Get-Item app\pitch-worklet.js) + @(Get-ChildItem electron -Filter *.js)
          $bad = 0
          foreach ($f in $files) { node --check $f.FullName; if ($LASTEXITCODE -ne 0) { $bad++ } }
          if ($bad) { Write-Error "$bad file(s) failed to parse"; exit 1 }

      - name: Build installer
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: CAMBOT-Setup-${{ env.VERSION }}
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem dist\CAMBOT-Setup-*.exe | Select-Object -First 1
          $notes = "Automatic build of $($env:GITHUB_SHA.Substring(0,7)). Download $($exe.Name), run it, and approve the Windows prompt."
          gh release create "v$env:VERSION" "$($exe.FullName)" --title "CAMBOT $env:VERSION" --notes "$notes" --latest

      # Auto-update: the app checks the public jkarsemeyer/cambot-releases repo for latest.yml.
      # Needs a repo secret RELEASES_TOKEN (fine-grained token, Contents: read and write on cambot-releases).
      - name: Publish update to cambot-releases
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { Write-Warning "RELEASES_TOKEN secret not set, so installed copies won't auto-update to this build."; exit 0 }
          $exe = Get-ChildItem dist\CAMBOT-Setup-*.exe | Select-Object -First 1
          $files = @($exe.FullName, "$($exe.FullName).blockmap", "dist\latest.yml")
          foreach ($f in $files) { if (-not (Test-Path $f)) { Write-Error "Missing $f"; exit 1 } }
          gh release create "v$env:VERSION" $files --repo jkarsemeyer/cambot-releases --title "CAMBOT $env:VERSION" --notes "Build of $($env:GITHUB_SHA.Substring(0,7))." --latest

  # Mac: runs after Windows so the release already exists, then adds the two Mac disk images to it.
  mac:
    needs: windows
    runs-on: macos-14
    env:
      VERSION: 0.2.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm version ${{ env.VERSION }} --no-git-tag-version --allow-same-version

      - name: Build Mac disk images (Apple Silicon and Intel)
        run: npx electron-builder --mac --publish never

      # Launch the built app for a few seconds to prove it starts (signature valid, nothing crashes on load).
      - name: Check the app launches
        run: |
          APP="dist/mac-arm64/CAMBOT.app"
          codesign --verify --deep --strict "$APP" && echo "signature ok"
          "$APP/Contents/MacOS/CAMBOT" > launch.log 2>&1 &
          PID=$!
          sleep 20
          if kill -0 $PID 2>/dev/null; then echo "CAMBOT is running after 20s"; kill $PID; else echo "CAMBOT exited early"; cat launch.log; exit 1; fi
          ls -lh dist/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: CAMBOT-${{ env.VERSION }}-mac
          path: dist/*.dmg
          if-no-files-found: error

      - name: Add to releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release upload "v$VERSION" dist/*.dmg --repo jkarsemeyer/cambot --clobber
          if [ -n "$RELEASES_TOKEN" ]; then GH_TOKEN="$RELEASES_TOKEN" gh release upload "v$VERSION" dist/*.dmg --repo jkarsemeyer/cambot-releases --clobber; fi
